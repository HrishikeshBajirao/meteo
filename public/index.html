<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Weather API Wrapper</title>
    </head>
    <body>
        <h1 id="title">Weather Today</h1>
        <form id="location-form" method="POST" action="/api/submit">
            <label for="city-input">Search City</label>
            <input id="city-input" type="text" name="city" required />
            <button type="submit">Search</button>
        </form>
        <div id="weather-container">
            
        </div>
        <script type="module" src="./script.js"></script>
    </body>
</html>
