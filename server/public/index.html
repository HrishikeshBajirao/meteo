<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Weather UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="search-card">
      <h1>Weather App</h1>
      <p>Simple frontend to display weather data from your backend.</p>

      <form id="weatherForm" class="search-form" autocomplete="off">
        <label class="sr-only" for="locationInput">Location</label>
        <input
          type="text"
          id="locationInput"
          name="location"
          placeholder="Enter city name"
          required
        >
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="weather-card hidden" id="weatherCard" aria-live="polite">
      
    </section>
  </main>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
